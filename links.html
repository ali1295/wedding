<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Invitation link maker</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:18px;background:#fbf6ee;color:#3a2a1a;line-height:1.5}
h1{font-size:24px}label{display:block;font-weight:600;margin-top:16px}
input,textarea{width:100%;padding:10px;font:inherit;border:2px solid #c9a24a;border-radius:8px;background:#fff}
textarea{min-height:130px}
button,a.b{display:inline-block;margin:4px 4px 0 0;padding:8px 14px;border:0;border-radius:20px;background:#7a1428;color:#fff;font:600 15px system-ui;text-decoration:none;cursor:pointer}
a.b{background:#128c4a}
.row{padding:12px 0;border-bottom:1px solid #ddd}.row code{display:block;word-break:break-all;font-size:13px;margin:4px 0;color:#555}
small{color:#666}
</style></head><body>
<h1>Invitation link maker</h1>
<p>Open this file on your own computer or phone. Nothing is sent anywhere.</p>
<label for="base">Your invitation link</label>
<input id="base" value="https://yourwedding.netlify.app/">
<label for="list">Guests, one per line: <small>Name, WhatsApp number (optional), seats (optional)</small></label>
<textarea id="list">Khala Jaan, 923001234567, 4
Chacha Ahmed, , 2
Sara Baji</textarea>
<label for="msg">Message</label>
<textarea id="msg" style="min-height:70px">Assalamualaikum! You are warmly invited to our wedding. Tap the link to open your card:</textarea>
<button id="go">Make links</button>
<div id="out"></div>
<script>
const $=s=>document.querySelector(s);
$("#go").onclick=()=>{
  const out=$("#out");out.textContent="";
  const base=$("#base").value.trim().split("?")[0];
  $("#list").value.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const [name,phone,seats]=l.split(",").map(s=>(s||"").trim());
    let url=base+"?name="+encodeURIComponent(name);
    if(parseInt(seats))url+="&seats="+parseInt(seats);
    const row=document.createElement("div");row.className="row";
    const t=document.createElement("b");t.textContent=name;
    const c=document.createElement("code");c.textContent=url;
    const cp=document.createElement("button");cp.textContent="Copy link";
    cp.onclick=()=>{navigator.clipboard.writeText(url);cp.textContent="Copied"};
    const w=document.createElement("a");w.className="b";w.target="_blank";w.rel="noopener";
    w.textContent="Send on WhatsApp";
    const num=phone.replace(/\D/g,"");
    w.href="https://wa.me/"+num+"?text="+encodeURIComponent($("#msg").value+" "+url);
    row.append(t,c,cp,w);out.append(row);
  });
};
</script></body></html>
